# A6_xray: domain-adapted for abdominal CT
# High RRC + CT/X-ray relevant corruptions:
#   gaussian noise, speckle noise, contrast decrease, gamma correction
- rrc:
    enabled: True
    crop_min_scale: 0.20
    crop_max_scale: 1.0
  color_jitter:
    prob: 0.8
    brightness: 0.8
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  grayscale:
    prob: 0.0
  gaussian_blur:
    prob: 0.0
  solarization:
    prob: 0.0
  equalization:
    prob: 0.0
  horizontal_flip:
    prob: 0.5
  speckle_noise:
    prob: 0.5
    std: 0.1
  contrast_decrease:
    prob: 0.5
    factor: 0.8
  gaussian_noise:
    prob: 0.5
    std: 0.1
  gamma_correction:
    prob: 0.5
    gamma_range: [0.7, 1.5]
  crop_size: 64
  num_crops: 2
  mean: [0.4677, 0.4677, 0.4677]
  std: [0.2479, 0.2479, 0.2479]
