# weak: minimal augmentation — centre crop only, no RRC, no colour jitter
# Used to test whether NCL collapses on OrganAMNIST without augmentation support
- rrc:
    enabled: False
    crop_min_scale: 1.0
    crop_max_scale: 1.0
  color_jitter:
    prob: 0.0
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  grayscale:
    prob: 0.0
  gaussian_blur:
    prob: 0.0
  solarization:
    prob: 0.0
  equalization:
    prob: 0.0
  horizontal_flip:
    prob: 0.5
  speckle_noise:
    prob: 0.0
    std: 0.1
  contrast_decrease:
    prob: 0.0
    factor: 0.8
  crop_size: 64
  num_crops: 2
  mean: [0.4677, 0.4677, 0.4677]
  std: [0.2479, 0.2479, 0.2479]
