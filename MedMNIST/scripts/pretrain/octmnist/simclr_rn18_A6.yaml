defaults:
  - _self_
  - augmentations: A6.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

name: "simclr-resnet18-octmnist-A6-corrected"
method: "simclr"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 256
  temperature: 0.2
  drop: 0
  non_neg: null
  loss_type: xent
  tau: 1
  gsize: 256
  learnable_temp: 0
  normalize: dim
  power_iter: 1
data:
  dataset: octmnist
  num_classes: 4
  train_path: "./MedMNIST"
  val_path: "./MedMNIST"
  format: "image_folder"
  num_workers: 0
  extra_data: None
  dup: 1
optimizer:
  name: "lars"
  batch_size: 256
  lr: 0.4
  classifier_lr: 0.1
  weight_decay: 1e-4
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
  keep_prev: False
auto_resume:
  enabled: True

max_epochs: 100
accumulate_grad_batches: 1
devices: [0]
sync_batchnorm: True
accelerator: "gpu"
strategy: "dp"
precision: 16
seed: 42
