# A6: domain-adapted for H&E histology
# High RRC + color jitter with hue (stain variation) + gaussian blur (focus artifacts)
# Hue jitter is the key domain-specific aug for H&E staining
- rrc:
    enabled: True
    crop_min_scale: 0.20
    crop_max_scale: 1.0
  color_jitter:
    prob: 0.8
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1
  grayscale:
    prob: 0.0
  gaussian_blur:
    prob: 0.2
  solarization:
    prob: 0.0
  equalization:
    prob: 0.0
  horizontal_flip:
    prob: 0.5
  speckle_noise:
    prob: 0.0
    std: 0.1
  contrast_decrease:
    prob: 0.0
    factor: 0.8
  crop_size: 64
  num_crops: 2
  mean: [0.7406, 0.5331, 0.7059]
  std: [0.1292, 0.1765, 0.1381]
